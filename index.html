<script>
/* Countdown */
(function(){
  const el = document.getElementById('countdown');
  const target = new Date('2026-06-30T00:00:00').getTime();
  function tick(){
    const d = Math.max(0, target - Date.now());
    const days = Math.floor(d / 86400000);
    const hours = Math.floor((d / 3600000) % 24);
    const mins = Math.floor((d / 60000) % 60);
    const secs = Math.floor((d / 1000) % 60);
    el.textContent = `${days}:${hours}:${mins}:${secs}`;
  }
  tick(); setInterval(tick,1000);
})();

/* Audio unlock */
(function(){
  const audio = document.getElementById('bg-audio');
  function unlock(){ audio.play().catch(()=>{}); }
  document.addEventListener('click', unlock, { once:true });
})();

/* Lazy video */
(function(){
  const video = document.getElementById('bgVideo');
  const src = "https://ia600802.us.archive.org/16/items/test-1-1_202605/test%20(1)%20(1).mp4";
  window.addEventListener('load', () => {
    requestAnimationFrame(() => { video.src = src; video.play().catch(()=>{}); });
  });
})();

/* Menu */
(function(){
  const menu = document.getElementById('menu');
  const openBtn = document.getElementById('openMenu');
  const closeBtn = document.getElementById('closeMenu');

  function openMenu(){ menu.classList.add('active'); }
  function closeMenu(){ menu.classList.remove('active'); }

  openBtn.addEventListener('click', openMenu);
  closeBtn.addEventListener('click', closeMenu);

  window.closeMenu = closeMenu;
})();

/* SPA */
(function(){
  const spa = document.getElementById('spa');
  const content = spa.querySelector('.spa-content');

  function closeSPA(){
    spa.classList.remove('active');
    window.scrollTo(0,0);
  }

  function openSPA(html){
    content.innerHTML = `
      <button class="spa-close" onclick="closeSPA()">CLOSE</button>
      ${html}
    `;
    spa.classList.add('active');
  }

  window.closeSPA = closeSPA;

  /* ABOUT */
  document.querySelectorAll('.spa-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      closeMenu();

      const page = link.dataset.page;

      if(page === 'about'){
        openSPA(`
          <h1>About LAstarworks</h1>

          <p>LAstarworks is a long-term personal project created by <strong>Goran Mandić — Limeniks</strong>. It connects astronomy, DIY engineering, 3D printing, and artistic installations into a single evolving story — built slowly, intentionally, and with a deep fascination for the night sky.</p>

          <p>Located in the quiet rural village of Piljenice, with low light pollution and open horizons, LAstarworks grows as both a technical workshop and a creative space. Every part of the project — from mechanical design to visual storytelling — is built by hand, piece by piece.</p>

          <h2>Bastion Observatory</h2>
          <p>The Bastion Observatory is a unique 3D-printed astronomical installation combining engineering, art, and real astrophotography hardware. It became widely recognized after the viral Reddit post <em>“My DIY 3D-printed observatory – BASTION (60-segment dome)”</em>.</p>

          <h2>Bastion Telescope</h2>
          <p>Inside the installation sits the Bastion Telescope, powered by an OpenAstroTracker system — an open-source GoTo mount capable of precise celestial tracking.</p>

          <h2>The 3D-Printed Astronaut Helmet</h2>
          <p>A full-scale 3D-printed astronaut helmet forms the outer shell of the Bastion Observatory. Printed in multiple PETG segments and assembled manually, it serves as both a sculpture and a functional housing for astronomical equipment.</p>

          <h2>A Science-Art Installation in Piljenice</h2>
          <p>The Bastion installation will become the central outdoor piece in the LAstarworks garden — a small science-art environment where technology, nature, and imagination coexist under the stars.</p>

          <ul>
            <li>a symbolic landmark of exploration</li>
            <li>a functional astronomical instrument</li>
            <li>a STEM educational piece</li>
            <li>an artistic sculpture illuminated by the night sky</li>
          </ul>

          <h2>Open Hardware, Open Sky</h2>
          <p>LAstarworks embraces open-source tools, modular engineering, and accessible technology. The project demonstrates that advanced astronomical equipment can be built at home with creativity, patience, and experimentation.</p>
        `);
      }

      if(page === 'contact'){
        openSPA(`
          <h1>Contact</h1>
          <p>Email: <strong>lastarworks@gmail.com</strong></p>
          <p>Instagram: @lastarworks.space</p>
          <p>YouTube: LAstarworks</p>
          <p>AstroBin: LAstarworks.space</p>
        `);
      }
    });
  });

  /* PROJECTS + FULL BIO */
  document.querySelectorAll('.menu-item.sub').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      closeMenu();

      const page = link.getAttribute('href');

      if(page === 'bio'){
        openSPA(`
          <h1>Goran Mandić (Limeniks) — Full Biography</h1>

          <p>Goran Mandić, known online as <strong>Limeniks</strong>, is a Croatian multidisciplinary artist, musician, filmmaker, and independent maker whose work bridges underground culture, DIY engineering, and astrophotography.</p>

          <p>Originally from Sisak, Croatia, and currently based in the rural village of Piljenice (population ~300), Mandić has developed a distinctive creative practice rooted in experimentation, self-reliance, and hands-on creation.</p>

          <p>He operates through two core identities: <strong>Limeniks Artworks</strong>, his original visual and production platform, and <strong>LAstarworks</strong>, his astronomy and engineering project. Together, they form a continuous evolution of the same idea — building things from scratch, whether sound, image, or systems, driven by curiosity and the joy of making.</p>

          <p>Through Limeniks Artworks, Mandić established his visual language within the Croatian underground music scene, producing music videos and visual content characterized by raw aesthetics, natural environments, and minimal production approaches. His work emphasized authenticity over polish, reflecting a strong DIY philosophy.</p>

          <p>As a musician, he performed in several underground bands including <strong>Šarena Pojava</strong>, <strong>Pištolj na gumene metke</strong>, and <strong>Blankets</strong>, contributing to the alternative and punk scene both musically and visually. This period shaped a mindset that continues to define his work: experimentation over perfection, and expression over limitation.</p>

          <p>Over time, his focus shifted toward astronomy, where he founded <strong>LAstarworks</strong> — a platform combining astrophotography, engineering, and visual storytelling. Working under dark rural skies, he began capturing wide-field nightscapes and deep-space imagery under the concept “the sky is a canvas.”</p>

          <p>Rather than building a single observatory, Mandić developed a broader idea: a small, self-built astropark integrated into a permaculture garden. This evolving environment merges astronomy, sustainable living, and DIY design into a unified space where natural and mechanical systems coexist.</p>

          <h2>BASTION Observatory</h2>

          <p>At the center of this project is <strong>BASTION Observatory</strong>, a fully custom-built, backyard observatory constructed using 3D printing, recycled hardware, and experimental engineering methods.</p>

          <p>Its most distinctive feature is a <strong>60-segment, fully 3D-printed dome</strong> made from durable PETG material, designed with a futuristic, helmet-like form that sets it apart from traditional observatories.</p>

          <p>The system itself is built from repurposed components, including parts from a decommissioned 3D printer, combined with custom tracking solutions and modified mechanical systems. Developed without a fixed blueprint, the observatory evolved through continuous iteration and hands-on problem solving.</p>

          <p>The setup supports deep-space imaging using adapted equipment, including vintage optics such as a <strong>Carl Zeiss Jena 180mm f/2.8</strong> lens, reflecting a hybrid approach that combines old and new technologies.</p>

          <p>Mandić documents his work through online platforms, where his projects have gained attention within astronomy and DIY communities. His approach emphasizes transparency, sharing not only results but also failures, costs, and development processes.</p>

          <p>Across all his work, a consistent philosophy remains: build with available resources, embrace experimentation, and maintain a sense of play. This mindset is often summarized in the idea that <em>no blueprint survives first contact with reality</em>.</p>

          <p>Through LAstarworks, he continues to develop the BASTION Observatory, the surrounding astropark, and his astrophotography archive, while working toward a central platform for documentation, open-source sharing, and visual storytelling.</p>

          <p>His work exists between disciplines — part engineering, part art, part astronomy, and part personal exploration — forming a continuous practice of building and observing, from underground music culture to the night sky above a small rural landscape.</p>
        `);
      }

      if(page === 'bastion'){ openSPA(`<h1>Bastion Observatory</h1><p>UNDER CONSTRUCTION</p>`); }
      if(page === 'garden'){ openSPA(`<h1>Garden</h1><p>UNDER CONSTRUCTION</p>`); }
      if(page === 'diy'){ openSPA(`<h1>DIY Technology</h1><p>UNDER CONSTRUCTION</p>`); }
    });
  });
})();
</script>
