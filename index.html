<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAstarworks — Limeniks</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- BACKGROUND -->
<div class="background-layer"></div>
<div class="video-wrapper">
  <video id="bgVideo" autoplay muted loop playsinline></video>
</div>

<!-- SOCIAL ROW -->
<div class="social-row">
  <a class="social-item" href="https://youtube.com/@LAstarworks" target="_blank">
    <img src="icons/youtube.svg"><span>YouTube</span>
  </a>
  <a class="social-item" href="https://instagram.com/lastarworks.space" target="_blank">
    <img src="icons/instagram.svg"><span>Instagram</span>
  </a>
  <a class="social-item" href="https://facebook.com/lastarworks" target="_blank">
    <img src="icons/facebook.svg"><span>Facebook</span>
  </a>
  <a class="social-item" href="mailto:limeniks.artworks@gmail.com">
    <img src="icons/mail.svg"><span>Email</span>
  </a>
</div>

<!-- LAUNCH BUTTON -->
<button class="enter-space-btn" id="openMenu">LAUNCH</button>

<!-- COUNTDOWN -->
<div class="countdown-bottom" id="countdown">00:00:00:00</div>

<!-- FOOTER -->
<footer>© LAstarworks.space — Project by Goran Mandić — Limeniks</footer>

<!-- FULLSCREEN MENU -->
<div class="fullscreen-menu" id="menu" aria-hidden="true">
  <div class="menu-close" id="closeMenu">CLOSE</div>
  <div class="menu-inner">
    <div class="menu-items">

      <!-- BIO (SPA) — umjesto MULTIMEDIA -->
      <a class="menu-item spa-link" data-page="bio">BIO</a>

      <!-- ABOUT ostaje kakav je -->
      <a class="menu-item spa-link" data-page="about">ABOUT THE PROJECT</a>

      <div class="menu-group">
        <div class="menu-group-title">PROJECTS</div>
        <a class="menu-item sub" href="bastion">Bastion Observatory</a>
        <a class="menu-item sub" href="garden">Garden</a>
        <a class="menu-item sub" href="diy">DIY Technology</a>
      </div>

      <a class="menu-item" href="gallery.html">GALLERY</a>
      <a class="menu-item" href="blog.html">BLOG NOTES</a>
      <a class="menu-item" href="events.html">EVENTS</a>

      <!-- CONTACT (SPA) — samo jedan -->
      <a class="menu-item spa-link" data-page="contact">CONTACT</a>

    </div>
  </div>
</div>

<!-- SPA OVERLAY -->
<div id="spa">
  <div class="spa-bg"></div>
  <div class="spa-overlay"></div>
  <div class="spa-content"></div>
</div>

<!-- AUDIO -->
<audio id="bg-audio" loop>
  <source src="audio/bg.mp3" type="audio/mpeg">
</audio>

<!-- SCRIPTS -->
<script>
/* Countdown */
(function(){
  const el = document.getElementById('countdown');
  const target = new Date('2026-06-30T00:00:00').getTime();
  function tick(){
    const now = Date.now();
    const d = Math.max(0, target - now);
    const days = Math.floor(d / 86400000);
    const hours = Math.floor((d / 3600000) % 24);
    const mins = Math.floor((d / 60000) % 60);
    const secs = Math.floor((d / 1000) % 60);
    el.textContent = `${String(days).padStart(2,'0')}:${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }
  tick();
  setInterval(tick,1000);
})();

/* Audio unlock */
(function(){
  const audio = document.getElementById('bg-audio');
  function unlock(){ if(audio.paused) audio.play().catch(()=>{}); }
  document.addEventListener('click', unlock, { once:true });
  document.addEventListener('touchstart', unlock, { once:true });
})();

/* Lazy-load video */
(function(){
  const video = document.getElementById('bgVideo');
  const src = "video/bg.mp4";
  window.addEventListener('load', () => {
    requestAnimationFrame(() => {
      video.src = src;
      video.play().catch(()=>{});
    });
  });
})();

/* Menu */
(function(){
  const menu = document.getElementById('menu');
  const openBtn = document.getElementById('openMenu');
  const closeBtn = document.getElementById('closeMenu');

  openBtn.onclick = () => menu.classList.add('active');
  closeBtn.onclick = () => menu.classList.remove('active');
})();

/* SPA LOADER */
(function(){
  const spa = document.getElementById('spa');
  const content = spa.querySelector('.spa-content');

  const pages = {

    /* ABOUT ostaje kakav je */
    about: `
      <button class="spa-close" onclick="closeSPA()">← BACK</button>
      <h1>About LAstarworks</h1>
      <p>LAstarworks is a long-term personal project created by Goran Mandić — Limeniks...</p>
      <p>Located in the quiet rural village of Piljenice...</p>
      <h2>Bastion Observatory</h2>
      <p>The Bastion Observatory is a unique 3D-printed astronomical installation...</p>
      <h2>Bastion Telescope</h2>
      <p>Inside the installation sits the Bastion Telescope...</p>
      <h2>The 3D-Printed Astronaut Helmet</h2>
      <p>A full-scale 3D-printed astronaut helmet forms the outer shell...</p>
      <h2>A Science-Art Installation in Piljenice</h2>
      <p>The Bastion installation will become the central outdoor piece...</p>
      <h2>Open Hardware, Open Sky</h2>
      <p>LAstarworks embraces open-source tools, modular engineering...</p>
    `,

    /* BIO — dugačka verzija */
    bio: `
      <button class="spa-close" onclick="closeSPA()">← BACK</button>
      <h1>BIO — Goran Mandić (Limeniks)</h1>

      <p><strong>Goran Mandić</strong>, poznat kao <strong>Limeniks</strong>, multidisciplinarni je umjetnik, glazbenik, fotograf, inženjer‑maker i autor vizualnih instalacija. Njegov rad spaja astronomiju, 3D printanje, DIY elektroniku, glazbu i filozofiju stvaranja.</p>

      <p>Rođen u Sisku, danas živi i stvara u Piljenicama — malom selu s minimalnim svjetlosnim onečišćenjem, gdje gradi svoj dugoročni projekt <strong>LAstarworks</strong>: spoj znanosti, umjetnosti i osobne slobode.</p>

      <h2>Limeniks Artworks</h2>
      <p>Pod imenom Limeniks Artworks djeluje kao vizualni umjetnik, fotograf i video autor. Njegovi radovi uključuju glazbene spotove, eksperimentalne kratke filmove, vizualne instalacije i dokumentiranje procesa izgradnje Bastiona.</p>

      <h2>BASTION Observatory</h2>
      <p>Najpoznatiji projekt — <strong>BASTION</strong> — 3D printana astronomska instalacija u obliku astronautske kacige, sastavljena od 60 PETG segmenata. Unutra se nalazi OpenAstroTracker GoTo sustav, vintage optika i moderni senzori.</p>

      <h2>Filozofija rada</h2>
      <blockquote>“No blueprint survives first contact with reality.”</blockquote>
      <p>Njegov pristup je iterativan, intuitivan i eksperimentalan. Svaki projekt je proces učenja, a svaka greška dio puta.</p>

      <h2>Glazba</h2>
      <p>17 godina svirao je bas gitaru u bendovima Blankets, Pištolj na gumene metke i Šarena pojava. Glazba i danas ostaje temeljni dio njegovog identiteta.</p>

      <h2>Permakultura i samodostatnost</h2>
      <p>Uz umjetnost i astronomiju, gradi mali samodostatni sustav: vrt, glistenjak, kokoši, hidroponiku, solarne sustave i radionicu.</p>

      <h2>Zaključak</h2>
      <p>Limeniks je spoj inženjera, umjetnika, filozofa i praktičara. LAstarworks je njegov životni projekt — prostor gdje se tehnologija, priroda i kreativnost susreću pod zvijezdama.</p>
    `,

    contact: `
      <button class="spa-close" onclick="closeSPA()">← BACK</button>
      <h1>CONTACT</h1>
      <p>Email: <strong>limeniks.artworks@gmail.com</strong></p>
      <p>Instagram: <strong>@lastarworks.space</strong></p>
      <p>YouTube: <strong>@LAstarworks</strong></p>
    `
  };

  function openSPA(page){
    content.innerHTML = pages[page] || "<p>Page not found.</p>";
    spa.classList.add("active");
    document.body.classList.add("spa-open");
  }

  window.closeSPA = function(){
    spa.classList.remove("active");
    document.body.classList.remove("spa-open");
  };

  document.querySelectorAll('.spa-link').forEach(a=>{
    a.addEventListener('click', ()=>{
      openSPA(a.dataset.page);
    });
  });
})();
</script>

</body>
</html>
