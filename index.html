<script>
/* Countdown */
(function(){
  const el = document.getElementById('countdown');
  const target = new Date('2026-06-30T00:00:00').getTime();

  function tick(){
    const now = Date.now();
    const d = Math.max(0, target - now);
    const days = Math.floor(d / 86400000);
    const hours = Math.floor((d / 3600000) % 24);
    const mins = Math.floor((d / 60000) % 60);
    const secs = Math.floor((d / 1000) % 60);
    el.textContent = `${String(days).padStart(2,'0')}:${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }

  tick();
  setInterval(tick,1000);
})();

/* Audio unlock */
(function(){
  const audio = document.getElementById('bg-audio');
  function unlock(){ if(audio.paused) audio.play().catch(()=>{}); }
  document.addEventListener('click', unlock, { once:true });
  document.addEventListener('touchstart', unlock, { once:true });
})();

/* Lazy-load video */
(function(){
  const video = document.getElementById('bgVideo');
  const src = "https://ia600802.us.archive.org/16/items/test-1-1_202605/test%20(1)%20(1).mp4";

  window.addEventListener('load', () => {
    requestAnimationFrame(() => {
      video.src = src;
      video.play().catch(()=>{});
    });
  });
})();

/* Menu */
(function(){
  const menu = document.getElementById('menu');
  const openBtn = document.getElementById('openMenu');
  const closeBtn = document.getElementById('closeMenu');
  const focusableSelector = 'a[href], button:not([disabled])';
  let lastFocused = null;

  function openMenu(){
    lastFocused = document.activeElement;
    menu.classList.add('active');
    menu.setAttribute('aria-hidden','false');
    openBtn.setAttribute('aria-expanded','true');
    const first = menu.querySelector('.menu-item');
    if(first) first.focus();
    document.addEventListener('focus', trapFocus, true);
    document.addEventListener('keydown', onKeyDown);
  }

  function closeMenu(){
    menu.classList.remove('active');
    menu.setAttribute('aria-hidden','true');
    openBtn.setAttribute('aria-expanded','false');
    if(lastFocused) lastFocused.focus();
    document.removeEventListener('focus', trapFocus, true);
    document.removeEventListener('keydown', onKeyDown);
  }

  function trapFocus(e){
    if(!menu.contains(e.target)){
      e.stopPropagation();
      const focusables = [...menu.querySelectorAll(focusableSelector)];
      if(focusables.length) focusables[0].focus();
    }
  }

  function onKeyDown(e){
    if(e.key === 'Escape') closeMenu();
    if(e.key === 'Tab'){
      const focusables = [...menu.querySelectorAll(focusableSelector)];
      if(!focusables.length) return;
      const idx = focusables.indexOf(document.activeElement);
      if(e.shiftKey && idx === 0){
        e.preventDefault();
        focusables[focusables.length-1].focus();
      }
      else if(!e.shiftKey && idx === focusables.length-1){
        e.preventDefault();
        focusables[0].focus();
      }
    }
  }

  openBtn.addEventListener('click', openMenu);
  closeBtn.addEventListener('click', closeMenu);

  function adjustMenuForViewport(){
    if(window.innerWidth <= 520 || (window.innerWidth < window.innerHeight && window.innerWidth <= 720)){
      menu.classList.add('mobile-layout');
      menu.classList.remove('desktop-layout');
    } else {
      menu.classList.add('desktop-layout');
      menu.classList.remove('mobile-layout');
    }
  }

  window.addEventListener('resize', adjustMenuForViewport);
  window.addEventListener('orientationchange', adjustMenuForViewport);
  adjustMenuForViewport();

  window.closeMenu = closeMenu;
})();

/* Social icons wave */
(function(){
  const icons = document.querySelectorAll('.social-item');

  function wave(direction='forward'){
    const seq = direction === 'forward' ? [...icons] : [...icons].reverse();
    seq.forEach((icon,i)=>{
      setTimeout(()=>{
        icon.classList.add('active-pulse');
        setTimeout(()=>icon.classList.remove('active-pulse'),500);
      }, i*200);
    });
    const total = seq.length*200 + 500;
    setTimeout(()=> wave(direction==='forward'?'backward':'forward'), total + 3000);
  }

  if(icons.length) wave('forward');
})();

/* SPA loader */
(function(){
  const spa = document.getElementById('spa');
  const content = spa.querySelector('.spa-content');

  function openSPA(html){
    content.innerHTML = html;
    spa.classList.add('active');
  }

  function closeSPA(){
    spa.classList.remove('active');
  }

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') closeSPA();
  });

  /* ABOUT + CONTACT SPA LINKS */
  document.querySelectorAll('.spa-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      closeMenu();

      const page = link.dataset.page;

      if(page === 'about'){
        openSPA(`
          <h1>About LAstarworks</h1>

          <p><strong>LAstarworks</strong> is a long-term personal project created by <strong>Goran Mandić — Limeniks</strong>. 
          It connects astronomy, DIY engineering, 3D printing, and artistic installations into a single evolving story — built slowly, intentionally, and with a deep fascination for the night sky.</p>

          <p>Located in the quiet rural village of Piljenice, with low light pollution and open horizons, LAstarworks grows as both a technical workshop and a creative space. Every part of the project — from mechanical design to visual storytelling — is built by hand, piece by piece.</p>

          <h2>Bastion Observatory</h2>
          <p>The Bastion Observatory is a unique 3D-printed astronomical installation combining engineering, art, and real astrophotography hardware. 
          It became widely recognized after the viral Reddit post <em>“My DIY 3D-printed observatory – BASTION (60-segment dome)”</em>.</p>

          <h2>Bastion Telescope</h2>
          <p>Inside the installation sits the Bastion Telescope, powered by an OpenAstroTracker system — an open-source GoTo mount capable of precise celestial tracking. 
          This fusion of open hardware and artistic design represents the core philosophy of LAstarworks: science as a creative journey.</p>

          <h2>The 3D-Printed Astronaut Helmet</h2>
          <p>A full-scale 3D-printed astronaut helmet forms the outer shell of the Bastion Observatory. Printed in multiple PETG segments and assembled manually, 
          it serves as both a sculpture and a functional housing for astronomical equipment.</p>

          <h2>A Science-Art Installation in Piljenice</h2>
          <p>The Bastion installation will become the central outdoor piece in the LAstarworks garden — a small science-art environment where technology, nature, and imagination coexist under the stars.</p>

          <ul>
            <li>a symbolic landmark of exploration</li>
            <li>a functional astronomical instrument</li>
            <li>a STEM educational piece</li>
            <li>an artistic sculpture illuminated by the night sky</li>
          </ul>

          <h2>Open Hardware, Open Sky</h2>
          <p>LAstarworks embraces open-source tools, modular engineering, and accessible technology. 
          The project demonstrates that advanced astronomical equipment can be built at home with creativity, patience, and experimentation.</p>

          <p>Thank you for visiting this corner of the universe called LAstarworks.</p>
        `);
      }

      if(page === 'contact'){
        openSPA(`
          <h1>Contact</h1>
          <p>You can reach me through:</p>
          <ul>
            <li>Email: <strong>lastarworks@gmail.com</strong></li>
            <li>Instagram: <strong>@lastarworks.space</strong></li>
            <li>YouTube: <strong>LAstarworks</strong></li>
            <li>AstroBin: <strong>LAstarworks.space</strong></li>
          </ul>
        `);
      }
    });
  });

  /* PROJECT SUBPAGES */
  document.querySelectorAll('.menu-item.sub').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      closeMenu();

      const page = link.getAttribute('href');

      if(page === 'bastion'){
        openSPA(`<h1>Bastion Observatory</h1><p>UNDER CONSTRUCTION</p>`);
      }
      if(page === 'garden'){
        openSPA(`<h1>Garden</h1><p>UNDER CONSTRUCTION</p>`);
      }
      if(page === 'diy'){
        openSPA(`<h1>DIY Technology</h1><p>UNDER CONSTRUCTION</p>`);
      }
      if(page === 'multimedia'){
        openSPA(`<h1>Multimedia</h1><p>UNDER CONSTRUCTION</p>`);
      }
    });
  });
})();
</script>
